<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sumar dos números</title>
</head>
<body>

    <h1>Sumar dos números</h1>
    <p>Por favor, introduce dos números:</p>

    <input type="number" id="num1" placeholder="Número 1"><br><br>
    <input type="number" id="num2" placeholder="Número 2"><br><br>

    <button type="button" onclick="sumar()">Sumar</button>

    <h2 id="resultado"></h2>

    <script>
        function sumar() {
            // Obtener los valores de los inputs
            let x = document.getElementById("num1").value;
            let y = document.getElementById("num2").value;

            // Validar si son números y realizar la suma
            if (x === "" || y === "" || isNaN(x) || isNaN(y)) {
                document.getElementById("resultado").innerText = "Por favor, introduce dos números válidos.";
            } else {
                let suma = parseFloat(x) + parseFloat(y);
                document.getElementById("resultado").innerText = "El resultado es: " + suma;
            }
        }
    </script>

</body>
</html>
